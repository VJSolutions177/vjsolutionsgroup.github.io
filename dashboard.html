<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HR Dashboard | VJ Solutions</title><style>body{font-family:Arial;background:#070707;color:#fff;padding:20px}h1{color:#d4af37}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:15px 0}input,select,button{padding:12px;border-radius:10px;border:1px solid #d4af37;background:#111;color:#fff}button{background:#d4af37;color:#000;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;background:#111;border-radius:16px;overflow:hidden}th,td{border-bottom:1px solid #333;padding:10px;text-align:left;font-size:14px}th{color:#d4af37}a{color:#d4af37}.note{background:#151515;border:1px solid #d4af37;padding:15px;border-radius:14px;margin:15px 0}</style></head><body><h1>VJ Solutions HR Dashboard</h1><div class="note">This dashboard reads from your Apps Script. Make sure Apps Script code from <b>apps-script.gs</b> is deployed as Web App.</div><div class="toolbar"><input id="search" oninput="render()" placeholder="Search name, phone, email, role"><select id="status" onchange="render()"><option value="all">All Status</option><option>Applied</option><option>HR Screening</option><option>Interview Scheduled</option><option>Selected</option><option>Rejected</option><option>Joined</option></select><button onclick="loadApplicants()">Refresh</button></div><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Domain</th><th>Status</th><th>Resume</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody></table><p><a href="index.html">Back to Website</a></p><script>const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxJJtMgGl1hVW_JWYa3_DXUOsdQMq9ois7pwHFtCQ2ifzKL6Czg-sF9QgA4etRr615U/exec';let applicants=[];async function loadApplicants(){try{const res=await fetch(WEB_APP_URL+'?action=list');applicants=await res.json();render();}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="8">Unable to load. Check Apps Script deployment/access.</td></tr>';}}function render(){const q=(document.getElementById('search').value||'').toLowerCase();const st=document.getElementById('status').value;let rows=applicants.filter(a=>JSON.stringify(a).toLowerCase().includes(q)&&(st==='all'||a.status===st));document.getElementById('rows').innerHTML=rows.map((a,i)=>`<tr><td>${a.date||''}</td><td>${a.name||''}</td><td>${a.phone||''}</td><td>${a.email||''}</td><td>${a.domain||''}</td><td><select onchange="updateStatus(${a.row},this.value)"><option>${a.status||'Applied'}</option><option>Applied</option><option>HR Screening</option><option>Interview Scheduled</option><option>Selected</option><option>Rejected</option><option>Joined</option></select></td><td>${a.resumeUrl?`<a href="${a.resumeUrl}" target="_blank">Download</a>`:'-'}</td><td><a href="https://wa.me/91${String(a.phone||'').replace(/\D/g,'')}" target="_blank">WhatsApp</a></td></tr>`).join('')||'<tr><td colspan="8">No applicants found.</td></tr>';}async function updateStatus(row,status){await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateStatus',row,status})});alert('Status updated');}loadApplicants();</script></body></html>
