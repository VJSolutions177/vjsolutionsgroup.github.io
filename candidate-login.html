<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Candidate Login | VJ Solutions</title><style>body{margin:0;font-family:Arial;background:#050505;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{background:#111;padding:35px;border-radius:22px;border:1px solid #d4af37;width:min(430px,90%);text-align:center;box-shadow:0 20px 55px rgba(0,0,0,.45)}h2{color:#d4af37}input,select{width:100%;box-sizing:border-box;padding:13px;margin:10px 0;border-radius:10px;border:1px solid #d4af37;background:#080808;color:white}button,.btn{display:block;width:100%;box-sizing:border-box;padding:13px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:bold;text-decoration:none;margin-top:10px}a{color:#d4af37}.status{margin-top:18px;padding:16px;border-radius:14px;background:#1a1a1a;border:1px solid rgba(212,175,55,.35);text-align:left}</style></head><body><div class="box"><h2>VJ Solutions Candidate Login</h2><p>Enter your registered phone number to check status.</p><input id="phone" placeholder="Registered Phone Number"><button onclick="checkStatus()">Check Status</button><div id="result"></div><a class="btn" href="interview-instructions.html">Download Interview Instructions</a><a href="index.html">Back to Home</a></div><script>function checkStatus(){let phone=document.getElementById('phone').value.trim();let result=document.getElementById('result');if(phone.length<10){result.innerHTML='<p style="color:#ff7777">Please enter a valid phone number.</p>';return;}result.innerHTML=`<div class="status"><b>Status Request Received</b><p>For live status, WhatsApp your registered number to VJ Solutions.</p><p><b>Your number:</b> ${phone}</p><a class="btn" href="https://wa.me/917729950118?text=${encodeURIComponent('Hi VJ Solutions, I want to check my application status. Registered number: '+phone)}" target="_blank">Open WhatsApp Status Check</a></div>`;}</script></body></html>
